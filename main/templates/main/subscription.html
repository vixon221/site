<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подписка FoodHub Pass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 500px;">
        <div class="card shadow border-0 p-4">
            <h3 class="fw-bold text-center mb-3">⭐ FoodHub Pass</h3>
            <p class="text-muted text-center mb-4">Бесплатная доставка на все заказы + 20% скидка на популярное меню за <b>490 сом/мес</b>.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Номер банковской карты (16 цифр)</label>
                    <input type="text" name="card_number" class="form-control" maxlength="16" required placeholder="4000 0000 0000 0000">
                    <small class="text-muted">Симуляция оплаты: вводятся только 16 цифр номера карты без CVV и даты.</small>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold btn-lg mt-3">Оплатить подписку (490 сом)</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'home' %}" class="text-muted text-decoration-none">← На главную</a>
            </div>
        </div>
    </div>
</body>
</html>
