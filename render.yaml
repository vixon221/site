services:
  # Настройка веб-сервиса (Django)
  - type: web
    name: foodhub-app
    env: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn foodhub.wsgi:application" # Замените foodhub на имя вашей папки с wsgi.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodhub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  # Настройка базы данных PostgreSQL
  - name: foodhub-db
    region: frankfurt
    plan: free